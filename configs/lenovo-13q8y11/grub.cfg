set timeout=5
set default=0

menuentry "Linux" {
    set root=(hd0,msdos1)
    linux /efi/boot/Image earlycon=efifb panic=0 console=tty0 arm-smmu.disable_bypass=0 clk_ignore_unused pd_ignore_unused regulator_ignore_unused fw_devlink.sync_state=strict ignore_loglevel drm.debug=0x1e log_buf_len=16M 
    initrd /efi/boot/initramfs.cpio.gz
    devicetree /efi/boot/kalambo-crd.dtb
}

menuentry "Linux (ACPI)" {
    set root=(hd0,msdos1)
    linux /efi/boot/Image earlycon=efifb panic=0 console=tty0 acpi=force arm-smmu.disable_bypass=0 clk_ignore_unused pd_ignore_unused regulator_ignore_unused 
    initrd /efi/boot/initramfs.cpio.gz
}

menuentry "Restart" {
    reboot
}
